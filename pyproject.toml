[project]
name = "twinkly-wall"
version = "0.1.0"
description = "A Raspberry Pi-controlled LED billboard using Twinkly Matrix for office Christmas fun"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Peter", email = "peter@example.com"}
]
keywords = ["twinkly", "led", "matrix", "billboard", "raspberry-pi"]

dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "pillow>=10.0",
    "typer>=0.27.3,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3,<7",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=7,<8",
    "ruff>=0.1",
]

[project.scripts]
twinklysay = "twinkly_wall.cli:main"
twinkly-wall = "twinkly_wall.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twinkly_wall"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Twinkly Wall Online Playlist
# For use with internet connection (includes weather)

default_duration: 10
default_transition: none

cards:
  # Carlsberg Research Laboratory branding (inverted)
  - type: carlsberg_lab
    scroll_speed: 25

  # Merry Christmas
  - type: text
    text: "Merry Christmas!"
    color: [255, 0, 0]
    scroll: true
    scroll_speed: 30
    prefix_sprite: tree
    suffix_sprite: tree

  # Tuborg Christmas sleigh - Santa and reindeer
  - type: tuborg_sleigh
    speed: 20

  # Tuborg Christmas truck - classic delivery scene
  - type: tuborg_truck
    speed: 18

  # Driving home for Christmas text
  - type: driving_home
    scroll_speed: 25

  # Weather forecast
  - type: weather
    duration: 8

  # Ocean waves
  - type: ocean
    duration: 8
    wave_speed: 1.0

  # Date and Time
  - type: calendar
    scroll: true
    scroll_speed: 30

  - type: clock
    duration: 5
    color: [255, 255, 255]
    format_24h: true
    blink_colon: true

  # Beer pouring
  - type: beer
    duration: 10

  # Free AI Training (1st showing)
  - type: text
    text: "FREE AI TRAINING - CONTACT PETER :-)"
    color: [0, 255, 0]
    scroll: true
    scroll_speed: 30
    prefix_sprite: tree
    suffix_sprite: tree

  # Countdown to Christmas (Dec 24 in Denmark)
  - type: countdown
    target: "2025-12-24"
    label: "XMAS"
    color: [255, 0, 0]
    scroll: true
    scroll_speed: 30
    prefix_sprite: tree
    suffix_sprite: tree

  # DNA helix (Carlsberg Research Lab theme)
  - type: dna
    duration: 10
    speed: 1.0

  # Science Magazine publication announcement
  - type: science_paper
    title: "Sleeping or Sprouting: Genetic variation in a barley kinase gene determines dormancy duration and preharvest sprouting"
    scroll_speed: 25

  # Barley field animation (celebrating the Science paper)
  - type: barley_field
    num_stalks: 20
    wind_speed: 1.0
    repeats: 3

  # Rubedo artwork announcement
  - type: pulse
    color: [255, 0, 0]
    mode: breathing
    text: "Rubedo by Zoran Gojkovic"
    text_color: [255, 255, 255]
    scroll_speed: 30

  # Danish Superliga standings (top 3)
  - type: superliga
    scroll_speed: 30
    max_teams: 3

  # Matrix rain
  - type: matrix
    duration: 8
    density: 15

  # Pac-Man being chased by ghosts
  - type: pacman_chase
    num_ghosts: 3
    speed: 20

  # Rainbow
  - type: rainbow
    duration: 8
    mode: rainbow
    speed: 1.0

  # Time for coffee
  - type: coffee
    duration: 8

  # Lava lamp
  - type: lava
    duration: 8
    num_blobs: 5

  # Pac-Man eating the monsters (revenge!)
  - type: pacman
    theme: ghosts
    speed: 20

  # Friday detector
  - type: friday

  # Plasma effect
  - type: rainbow
    duration: 8
    mode: plasma
    speed: 1.5

  # ChatGPT Leaderboard
  - type: leaderboard
    title: "ChatGPT Top 10"
    scroll_speed: 25
    entries:
      - name: "Flavia Krsticevic"
        score: 8188
      - name: "Roberto Schimmenti"
        score: 2580
      - name: "Carl Malina"
        score: 2264
      - name: "Maria Moraru"
        score: 1956
      - name: "Magnus Wohlfahrt Rasmussen"
        score: 1896
      - name: "Rolf Ringborg"
        score: 1624
      - name: "Gorm S. Smidt-Jensen"
        score: 1611
      - name: "Ernesto Arreola"
        score: 1290
      - name: "Philip Tinggaard Thomsen"
        score: 1252
      - name: "Morten Egevang Jørgensen"
        score: 1229

  # Snowfall
  - type: snow
    duration: 10
    wind: 0.3
    accumulate: true

  # Color wave
  - type: rainbow
    duration: 8
    mode: wave
    speed: 1.0

  # Free AI Training (2nd showing)
  - type: text
    text: "FREE AI TRAINING - CONTACT PETER :-)"
    color: [0, 255, 0]
    scroll: true
    scroll_speed: 30
    prefix_sprite: tree
    suffix_sprite: tree

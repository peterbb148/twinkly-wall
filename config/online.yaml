# Twinkly Wall Online Playlist
# For use with internet connection (includes weather)

default_duration: 10
default_transition: none

cards:
  # Carlsberg Research Laboratory branding (inverted)
  - type: carlsberg_lab
    duration: 12
    scroll_speed: 25

  # Merry Christmas
  - type: text
    text: "Merry Christmas!"
    color: [255, 0, 0]
    scroll: true
    scroll_speed: 30
    duration: 8

  # Weather forecast
  - type: weather
    duration: 8

  # Ocean waves
  - type: ocean
    duration: 8
    wave_speed: 1.0

  # Date and Time
  - type: calendar
    duration: 5

  - type: clock
    duration: 5
    color: [255, 255, 255]
    format_24h: true
    blink_colon: true

  # Beer pouring
  - type: beer
    duration: 10

  # Free AI Training (1st showing)
  - type: text
    text: "FREE AI TRAINING - CONTACT PETER :-)"
    color: [0, 255, 0]
    scroll: true
    scroll_speed: 30
    prefix_sprite: tree
    suffix_sprite: tree
    duration: 15

  # Countdown to Christmas (Dec 24 in Denmark)
  - type: countdown
    target: "2025-12-24"
    label: "XMAS"
    color: [255, 0, 0]
    scroll: true
    scroll_speed: 30
    prefix_sprite: tree
    suffix_sprite: tree
    duration: 12

  # Matrix rain
  - type: matrix
    duration: 8
    density: 15

  # Pac-Man being chased by ghosts
  - type: pacman_chase
    duration: 10
    num_ghosts: 3
    speed: 20

  # Rainbow
  - type: rainbow
    duration: 8
    mode: rainbow
    speed: 1.0

  # Time for coffee
  - type: coffee
    duration: 8

  # Lava lamp
  - type: lava
    duration: 8
    num_blobs: 5

  # Pac-Man eating the monsters (revenge!)
  - type: pacman
    duration: 10
    theme: ghosts
    speed: 20

  # Friday detector
  - type: friday
    duration: 5

  # Plasma effect
  - type: rainbow
    duration: 8
    mode: plasma
    speed: 1.5

  # ChatGPT Leaderboard
  - type: leaderboard
    duration: 30
    title: "ChatGPT Top 10"
    scroll_speed: 25
    entries:
      - name: "Flavia Krsticevic"
        score: 8188
      - name: "Roberto Schimmenti"
        score: 2580
      - name: "Carl Malina"
        score: 2264
      - name: "Maria Moraru"
        score: 1956
      - name: "Magnus Wohlfahrt Rasmussen"
        score: 1896
      - name: "Rolf Ringborg"
        score: 1624
      - name: "Gorm S. Smidt-Jensen"
        score: 1611
      - name: "Ernesto Arreola"
        score: 1290
      - name: "Philip Tinggaard Thomsen"
        score: 1252
      - name: "Morten Egevang Jørgensen"
        score: 1229

  # Snowfall
  - type: snow
    duration: 10
    wind: 0.3
    accumulate: true

  # Color wave
  - type: rainbow
    duration: 8
    mode: wave
    speed: 1.0

  # Free AI Training (2nd showing)
  - type: text
    text: "FREE AI TRAINING - CONTACT PETER :-)"
    color: [0, 255, 0]
    scroll: true
    scroll_speed: 30
    prefix_sprite: tree
    suffix_sprite: tree
    duration: 15

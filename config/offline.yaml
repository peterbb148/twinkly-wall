# Twinkly Wall Offline Playlist
# For use without internet connection

default_duration: 10
default_transition: none

cards:
  # Carlsberg Research Laboratory branding (inverted)
  - type: carlsberg_lab
    duration: 12
    scroll_speed: 25

  # Merry Christmas
  - type: text
    text: "Merry Christmas!"
    color: [255, 0, 0]
    scroll: true
    scroll_speed: 30
    duration: 8

  # Date and Time
  - type: calendar
    duration: 5

  - type: clock
    duration: 5
    color: [255, 255, 255]
    format_24h: true
    blink_colon: true

  # Countdown to Christmas
  - type: countdown
    target: "2025-12-25"
    label: "XMAS"
    color: [255, 0, 0]
    duration: 8

  # Pac-Man being chased by ghosts
  - type: pacman_chase
    duration: 10
    num_ghosts: 3
    speed: 20

  # Time for coffee
  - type: coffee
    duration: 8

  # Pac-Man eating the monsters (revenge!)
  - type: pacman
    duration: 10
    theme: ghosts
    speed: 20

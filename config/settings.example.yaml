# Twinkly Wall Settings
# Copy this file to settings.yaml and configure your values

twinkly:
  # IP address of your Twinkly device (or leave empty to use discovery)
  host: ""

weather:
  # Coordinates for Open-Meteo weather API (no API key needed!)
  # Get coordinates from https://www.latlong.net/
  latitude: 55.6761  # Copenhagen
  longitude: 12.5683
  # Cache duration in seconds
  cache_duration: 600

leaderboard:
  # Your custom leaderboard API endpoint
  api_url: ""
  # API key if required
  api_key: ""
  # Cache TTL in seconds
  cache_ttl: 60

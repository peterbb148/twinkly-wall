name: Release Twinkly Wall

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: write
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    concurrency:
      group: twinklysay-binary-retention
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "twinkly-cli-*-arm64"
          path: dist
      - name: Publish verified archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          assets=()
          for name in "twinkly-cli-$version-darwin-arm64" "twinkly-cli-$version-ubuntu-arm64"; do
            archive="$name.tar.gz"
            test -s "dist/$name/$archive"
            (cd "dist/$name" && sha256sum --strict --check "$archive.sha256")
            assets+=("dist/$name/$archive" "dist/$name/$archive.sha256")
          done
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag --title "Twinkly Wall $GITHUB_REF_NAME" --generate-notes \
            --notes "Twinkly CLI includes wall and say modes. Supports Ubuntu 24.04 and 26.04 LTS ARM64 and macOS 15 or newer on Apple Silicon. The macOS executable is ad-hoc signed. Verify the SHA-256 checksum before installing. See docs/CLI.md in the tagged source."
      - name: Keep current and previous binary versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/retain_binaries.py releases --repo "$GH_REPO" --current "$GITHUB_REF_NAME" --apply
          python3 scripts/retain_binaries.py artifacts --repo "$GH_REPO" --current "$GITHUB_RUN_ID" --apply

name: Release macOS CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: write
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    concurrency:
      group: twinklysay-binary-retention
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: twinklysay-*-darwin-arm64
          merge-multiple: true
          path: dist
      - name: Publish the verified binary and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "Twinklysay $GITHUB_REF_NAME" --generate-notes \
            --notes "For macOS 14 or newer on Apple Silicon (ARM64). Includes Python; no Python or UV installation is needed. Ad-hoc signed, without an Apple Developer signature or notarization. Verify the SHA-256 checksum before installing. See docs/CLI.md in the tagged source for installation and Gatekeeper instructions."
      - name: Keep current and previous binary versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/retain_binaries.py releases --repo "$GH_REPO" --current "$GITHUB_REF_NAME" --apply
          python3 scripts/retain_binaries.py artifacts --repo "$GH_REPO" --current "$GITHUB_RUN_ID" --apply

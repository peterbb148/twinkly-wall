name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      build-binaries:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-scope:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.build-binaries && github.event_name != 'workflow_dispatch' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether to build binaries
        id: scope
        env:
          FORCE_BINARY_BUILD: ${{ inputs.build-binaries || github.event_name == 'workflow_dispatch' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$FORCE_BINARY_BUILD" == true ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            build=$(bash scripts/cli_changed.sh "$GITHUB_EVENT_NAME" "$BASE_SHA" "$HEAD_SHA")
            echo "build=$build" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.5"
          python-version: "3.11"
      - run: uv sync --locked
      - name: Check release tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv run --locked python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from twinkly_wall import __version__
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag must match pyproject.toml"
          assert version == __version__, "Package and CLI versions must match"
          PY
      - name: Audit locked runtime, development, and build dependencies
        run: uv audit --locked --python-version 3.11
      - name: Run all tests and measure CLI coverage
        run: |
          uv run --locked pytest --cov=twinkly_wall.cli --cov=scripts.retain_binaries --cov=twinkly_wall.command --cov-branch --cov-report=term-missing --cov-fail-under=81
          uv run --locked coverage report --include='scripts/retain_binaries.py' --fail-under=81
          uv run --locked coverage report --include='src/twinkly_wall/cli.py' --fail-under=81
          uv run --locked coverage report --include='src/twinkly_wall/command.py' --fail-under=81
      - run: uv run --locked ruff check src/ tests/ scripts/ packaging/
      - run: uv run --locked ruff format --check src/ tests/ scripts/ packaging/

  macos-binary:
    needs: binary-scope
    if: needs.binary-scope.outputs.build == 'true'
    runs-on: macos-15
    outputs:
      artifact-name: ${{ steps.binary-version.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.5"
          python-version: "3.11"
      - name: Build native ARM64 binary and run isolated smoke tests
        run: bash scripts/build_macos.sh
      - name: Name the artifact by binary version
        id: binary-version
        run: |
          version="$(uv run --locked --no-sync python -c 'from twinkly_wall import __version__; print(__version__)')"
          echo "artifact-name=twinkly-cli-${version}-darwin-arm64" >> "$GITHUB_OUTPUT"
      - name: Upload verified binary archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.binary-version.outputs.artifact-name }}
          path: |
            dist/twinkly-cli-*-darwin-arm64.tar.gz
            dist/twinkly-cli-*-darwin-arm64.tar.gz.sha256
          if-no-files-found: error

  macos-install:
    needs: macos-binary
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/install_macos.sh
            scripts/install_release_binary.sh
            scripts/smoke_installer.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.macos-binary.outputs.artifact-name }}
          path: ${{ runner.temp }}/twinkly-cli-download
      - name: Verify and test the downloaded archive on a fresh runner
        working-directory: ${{ runner.temp }}/twinkly-cli-download
        run: |
          shasum -a 256 -c ./*.sha256
          tar -xzf twinkly-cli-*-darwin-arm64.tar.gz
          test "$(lipo -archs twinkly-cli)" = arm64
          codesign --verify --strict twinkly-cli
          python3 checks/smoke_binary.py "$PWD/twinkly-cli"
          bash "$GITHUB_WORKSPACE/scripts/smoke_installer.sh" darwin-arm64 "$PWD"/twinkly-cli-*-darwin-arm64.tar.gz

  ubuntu-binaries:
    needs: binary-scope
    if: needs.binary-scope.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.binary-version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.5"
          python-version: "3.11"
      - name: Build native Ubuntu ARM64 binary
        run: bash scripts/build_ubuntu.sh
      - name: Read the binary version
        id: binary-version
        run: |
          version="$(uv run --locked --no-sync python -c 'from twinkly_wall import __version__; print(__version__)')"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Upload the twinkly-cli archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twinkly-cli-${{ steps.binary-version.outputs.value }}-ubuntu-arm64
          path: |
            dist/twinkly-cli-${{ steps.binary-version.outputs.value }}-ubuntu-arm64.tar.gz
            dist/twinkly-cli-${{ steps.binary-version.outputs.value }}-ubuntu-arm64.tar.gz.sha256
          if-no-files-found: error

  ubuntu-install:
    needs: ubuntu-binaries
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/install_ubuntu.sh
            scripts/install_release_binary.sh
            scripts/smoke_installer.sh
            scripts/smoke_linux.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: twinkly-cli-${{ needs.ubuntu-binaries.outputs.version }}-ubuntu-arm64
          path: ${{ runner.temp }}/ubuntu-downloads/twinkly-cli-${{ needs.ubuntu-binaries.outputs.version }}-ubuntu-arm64
      - name: Verify the downloaded binary in clean Ubuntu ARM64
        env:
          UBUNTU_RELEASE: ${{ matrix.ubuntu }}
          PACKAGE_VERSION: ${{ needs.ubuntu-binaries.outputs.version }}
        run: |
          docker run --rm --platform linux/arm64 --network none \
            --mount "type=bind,source=$RUNNER_TEMP/ubuntu-downloads,target=/downloads,readonly" \
            --mount "type=bind,source=$PWD/scripts,target=/checks,readonly" \
            "ubuntu:$UBUNTU_RELEASE" bash /checks/smoke_linux.sh /downloads "$PACKAGE_VERSION" ubuntu-arm64

  raspberry-pi-binary:
    needs: binary-scope
    if: needs.binary-scope.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.5"
      - name: Build against the Trixie ARM64 runtime
        id: pi-build
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y debootstrap
          runtime="$RUNNER_TEMP/pi-runtime"
          build="$RUNNER_TEMP/pi-build"
          keyring_package="$RUNNER_TEMP/debian-archive-keyring.deb"
          curl --fail --silent --show-error \
            https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb \
            -o "$keyring_package"
          printf '%s  %s\n' 9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac "$keyring_package" \
            | sha256sum --strict --check
          dpkg-deb -x "$keyring_package" "$RUNNER_TEMP/debian-keys"
          sudo debootstrap --variant=minbase --include=ca-certificates \
            --keyring="$RUNNER_TEMP/debian-keys/usr/share/keyrings/debian-archive-keyring.pgp" \
            trixie "$runtime" https://deb.debian.org/debian
          sudo cp -a "$runtime" "$build"
          sudo mount -t proc proc "$build/proc"
          trap 'sudo umount "$build/proc"' EXIT
          sudo chroot "$build" apt-get update
          sudo chroot "$build" apt-get install -y --no-install-recommends binutils libpython3.13 python3
          sudo install -m 755 "$(command -v uv)" "$build/usr/local/bin/uv"
          sudo mkdir "$build/src"
          git archive HEAD | sudo tar -x -C "$build/src"
          sudo chroot "$build" bash /src/scripts/build_raspberry_pi.sh
          mkdir -p dist
          sudo cp "$build"/src/dist/twinkly-cli-*-raspberry-pi-arm64.tar.gz{,.sha256} dist/
          archive=(dist/twinkly-cli-*-raspberry-pi-arm64.tar.gz)
          name="${archive[0]##*/}"
          echo "artifact-name=${name%.tar.gz}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pi-build.outputs.artifact-name }}
          path: |
            dist/twinkly-cli-*-raspberry-pi-arm64.tar.gz
            dist/twinkly-cli-*-raspberry-pi-arm64.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.pi-build.outputs.artifact-name }}
          path: ${{ runner.temp }}/pi-downloads/${{ steps.pi-build.outputs.artifact-name }}
      - name: Verify the downloaded archive in a clean Trixie ARM64 userspace
        env:
          ARTIFACT_NAME: ${{ steps.pi-build.outputs.artifact-name }}
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/pi-runtime"
          sudo cp -a scripts "$runtime/checks"
          sudo cp -a "$RUNNER_TEMP/pi-downloads" "$runtime/downloads"
          sudo mount -t proc proc "$runtime/proc"
          trap 'sudo umount "$runtime/proc"' EXIT
          version="${ARTIFACT_NAME#twinkly-cli-}"
          version="${version%-raspberry-pi-arm64}"
          sudo chroot "$runtime" bash /checks/smoke_linux.sh /downloads "$version" raspberry-pi-arm64

  retain-binaries:
    needs: [test, macos-install, ubuntu-install, raspberry-pi-binary]
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    concurrency:
      group: twinklysay-binary-retention
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep current and previous verified binary versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/retain_binaries.py artifacts --repo "$GH_REPO" --current "$GITHUB_RUN_ID" --apply
